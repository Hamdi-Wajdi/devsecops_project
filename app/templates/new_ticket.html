{% extends "base.html" %}

{% block content %}
<div style="margin-bottom: 1rem;">
    <a href="{{ url_for('tickets') }}" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">&larr; Annuler et retourner</a>
</div>

<div class="card" style="max-width: 700px; margin: 0 auto;">
    <h2 style="margin-bottom: 1.5rem;">Ouvrir un nouveau ticket de support</h2>
    <form method="POST" action="{{ url_for('new_ticket') }}">
        <div class="form-group">
            <label for="title">Objet / Résumé du problème *</label>
            <input type="text" id="title" name="title" class="form-control" placeholder="ex: Panne réseau, perte d'accès, demande d'équipement..." required autofocus>
        </div>

        <div class="form-group">
            <label for="priority">Niveau de priorité</label>
            <select name="priority" id="priority" class="form-control">
                <option value="LOW">Basse (LOW) - Simple question ou besoin non urgent</option>
                <option value="MEDIUM" selected>Moyenne (MEDIUM) - Gêne dans le travail quotidien</option>
                <option value="HIGH">Haute (HIGH) - Blocage total de l'activité</option>
            </select>
        </div>

        <div class="form-group">
            <label for="description">Description détaillée *</label>
            <textarea id="description" name="description" class="form-control" rows="6" placeholder="Décrivez les symptômes rencontrés, messages d'erreur, étapes pour reproduire..." required></textarea>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary">Créer le ticket</button>
            <a href="{{ url_for('tickets') }}" class="btn btn-secondary">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
