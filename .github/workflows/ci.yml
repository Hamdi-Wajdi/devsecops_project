name: DevSecOps Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks (valeurs masquees)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --no-banner --exit-code 1

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:latest \
            semgrep scan --config p/python --config p/owasp-top-ten \
            --metrics=off --error

  deps:
    name: Dependances (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Avertissement HIGH (non bloquant)
        run: |
          docker run --rm -v "$PWD:/work" aquasec/trivy:0.57.1 \
            fs --scanners vuln --severity HIGH --exit-code 0 /work/app
      - name: Blocage CRITICAL corrigeable
        run: |
          docker run --rm -v "$PWD:/work" aquasec/trivy:0.57.1 \
            fs --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 /work/app

  image:
    name: Image (build + Trivy)
    runs-on: ubuntu-latest
    needs: [secrets, sast, deps]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dockerfile present ?
        id: df
        run: |
          if [ -f app/Dockerfile ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build de l'image
        if: steps.df.outputs.ok == 'true'
        run: docker build -t helpdesk:${{ github.sha }} app/
      - name: Scan image - HIGH (non bloquant)
        if: steps.df.outputs.ok == 'true'
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 \
            image --severity HIGH --exit-code 0 helpdesk:${{ github.sha }}
      - name: Scan image - CRITICAL (bloquant)
        if: steps.df.outputs.ok == 'true'
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 helpdesk:${{ github.sha }}