services:
  db:
    image: postgres:15-alpine
    container_name: helpdesk-db
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk_user -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: helpdesk-web
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: helpdesk
      DB_USER: helpdesk_user
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      HELPDESK_INTERNAL_API_SECRET: ${HELPDESK_INTERNAL_API_SECRET}
      HELPDESK_SLACK_WEBHOOK_KEY: ${HELPDESK_SLACK_WEBHOOK_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
