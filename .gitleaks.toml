title = "Regles Gitleaks du projet HelpDesk"

[extend]
useDefault = true

[[rules]]
id = "helpdesk-fake-secret"
description = "Secret fictif en dur (cle, token ou mot de passe)"
regex = '''(?i)(api[_-]?key|secret|token|password)\s*[=:]\s*['"]?[A-Za-z0-9_\-]{12,}'''
keywords = ["api_key", "apikey", "api-key", "secret", "token", "password"]
